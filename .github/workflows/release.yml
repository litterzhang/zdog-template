name: Release

# 打 tag 触发。也可以手动跑，用于重发或补发某个平台的 wheel。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GO_VERSION: "1.25"

jobs:
  # ── 平台 wheel ────────────────────────────────────────────────
  # 包里带 .so，所以每个平台都要单独构建。标签由 hatch_build.py 决定。
  wheels:
    name: wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 在 manylinux 容器里构建：PyPI 直接拒绝 linux_x86_64 标签，
          # 而且容器里的 glibc 更老，构出来的 .so 兼容面更宽。
          - name: manylinux-x86_64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            tag: py3-none-manylinux_2_28_x86_64
          - name: macos-arm64
            os: macos-latest
            tag: ""            # 留空则由钩子从当前平台推断
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      # manylinux 容器里没有 Go，直接装官方 tarball —— setup-go 在这种
      # 老发行版容器里未必可用。
      - name: 安装 Go（容器内）
        if: matrix.container != ''
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.0.linux-amd64.tar.gz" -o /tmp/go.tgz
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"

      - uses: actions/setup-go@v7
        if: matrix.container == ''
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - uses: astral-sh/setup-uv@v9.0.0

      - name: 构建 .so 并打包
        env:
          ZTPL_WHEEL_TAG: ${{ matrix.tag }}
        run: |
          ext=so; [ "$RUNNER_OS" = macOS ] && ext=dylib
          # -buildvcs=false：manylinux 容器里 checkout 的属主与运行用户不同，
          # git 会以 dubious ownership 拒绝，Go 取 VCS 信息就失败。
          # 我们也不需要把 commit 戳进 .so，顺带让构建更可复现。
          go build -buildvcs=false -buildmode=c-shared -o "cshared/libztpl.$ext" ./cshared/
          cp cshared/libztpl.* sdk/python/ztemplate/
          cd sdk/python && uv build --wheel

      # 装到干净环境跑一遍。这一步在写 CI 当天就抓到过 .so 没进 wheel 的问题。
      - name: 冒烟 —— 只靠 wheel 自带的库
        run: |
          cd "$(mktemp -d)"
          uv venv && uv pip install "$GITHUB_WORKSPACE"/sdk/python/dist/*.whl
          uv run python -c "
          from ztemplate import Template, abi_version, lib_path
          print('ABI', abi_version(), lib_path())
          with Template('[\${a}] \${b}', target='\${b}/\${a}') as t:
              assert t.transform_text('[x] y') == 'y/x\n'
          "

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-wheel-${{ matrix.name }}
          path: sdk/python/dist/*.whl

  # ── CLI 是纯 Python，一个 wheel 通吃 ──────────────────────────
  cli-wheel:
    name: wheel (zdog-template-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: 构建
        # 去掉本地路径依赖：发布版要从 PyPI 解析 ztpl
        run: |
          python3 - <<'EOF'
          import pathlib, re
          p = pathlib.Path("cli/pyproject.toml")
          p.write_text(re.sub(r"\n\[tool\.uv\.sources\][^\[]*", "\n", p.read_text()))
          EOF
          cd cli && uv build --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: cli-wheel
          path: cli/dist/*.whl

  # ── 发布到 PyPI ──────────────────────────────────────────────
  # 用 Trusted Publishing（OIDC）：不需要在仓库里存 API token。
  #
  # 两个包各用**独立的 environment**，而不是共用一个。PyPI 的可信发布者是按
  # (owner, repo, workflow, environment) 匹配的 —— 共用一个环境意味着任何一个
  # 发布 job 都能往两个项目推包。分开之后每个 job 的 OIDC 身份只对自己那个包
  # 有效，CLI 的构建被污染也发不了 SDK。也便于分别设审批。
  #
  # 前置条件见 docs/PUBLISHING.md。
  publish-sdk:
    name: 发布 zdog-template
    needs: wheels
    runs-on: ubuntu-latest
    environment: release-sdk
    permissions:
      id-token: write        # OIDC 必需
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sdk-wheel-*
          path: dist
          merge-multiple: true
      - name: 列出将要发布的包
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── GitHub Release ───────────────────────────────────────────
  # 附上各平台的 .so —— ABI 是语言中立的，别的语言绑定用得上，
  # 而 PyPI 只服务 Python。
  github-release:
    name: GitHub Release
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: sdk-wheel-*
          path: artifacts
          merge-multiple: true

      - name: 从 CHANGELOG 摘出本版的说明
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # 取 "## [x.y.z]" 到下一个 "## [" 之间的内容
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md 里没有 $ver 这一节" >&2; exit 1
          fi
          wc -l notes.md

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            artifacts/*.whl

  # CLI 依赖 SDK，所以等 SDK 发完再发 —— 否则用户装 CLI 时依赖还解析不到。
  # SDK 发布失败时 CLI 也不该发：没有 SDK 的 CLI 是废的。
  publish-cli:
    name: 发布 zdog-template-cli
    needs: [cli-wheel, publish-sdk]
    runs-on: ubuntu-latest
    environment: release-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cli-wheel
          path: dist
      - name: 列出将要发布的包
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
