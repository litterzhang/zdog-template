[project]
name = "zdog-template"
version = "0.1.0"
description = "Z-Template —— 双向模板：一份模板同时用于解析与格式化，外加声明式文本转换流水线"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Huge Zhang" }]
keywords = ["template", "parsing", "text-transformation", "bidirectional", "round-trip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Go",
    "Topic :: Text Processing :: General",
]

# 运行期零依赖：SDK 只用标准库 ctypes 调用 libztpl.so。
# 实测批量调用下 FFI 边界成本摊到每行 0.0003 µs，纯 C 与 Python 只差 ~8%，
# 因此没有理由引入 cffi 这类编译期依赖。
dependencies = []

[project.urls]
Homepage = "https://github.com/litterzhang/zdog-template"
Design = "https://github.com/litterzhang/zdog-template/blob/main/docs/DESIGN.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # 构建期依赖，但 tests/ 里要测 hatch_build.py 这个钩子
    "hatchling",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 平台标签由构建钩子设置 —— 静态配置里写 pure-python 是无效的，
# WheelBuilderConfig 上并没有那个选项。见 hatch_build.py。
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["ztemplate"]
# 共享库随 wheel 一起分发。artifacts 用来强制包含被 .gitignore 忽略的文件。
#
# 注意必须用 `uv build --wheel` 直接构建：默认的 `uv build` 会先打 sdist、
# 再从 sdist 构建 wheel，而 .so 是平台产物不该进 sdist —— 于是 wheel 里也就没有了。
artifacts = ["ztemplate/libztpl.*", "ztemplate/ztpl.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
